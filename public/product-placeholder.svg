<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-gradient)" rx="12"/>
  
  <!-- Icon - Construction/Building themed -->
  <g transform="translate(300, 150)">
    <!-- Building outline -->
    <rect x="-40" y="-30" width="80" height="100" fill="#cbd5e1" rx="4"/>
    
    <!-- Windows -->
    <rect x="-30" y="-15" width="20" height="15" fill="#94a3b8" rx="2"/>
    <rect x="10" y="-15" width="20" height="15" fill="#94a3b8" rx="2"/>
    <rect x="-30" y="10" width="20" height="15" fill="#94a3b8" rx="2"/>
    <rect x="10" y="10" width="20" height="15" fill="#94a3b8" rx="2"/>
    
    <!-- Door -->
    <rect x="-12" y="35" width="24" height="35" fill="#64748b" rx="2"/>
    
    <!-- Roof -->
    <path d="M -50 -30 L 0 -60 L 50 -30 Z" fill="#94a3b8"/>
  </g>
  
  <!-- Text -->
  <text x="50%" y="85%" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#64748b" text-anchor="middle">
    Product Image
  </text>
</svg>
